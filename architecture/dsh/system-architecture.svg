<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340" role="img" aria-labelledby="title description">
  <title id="title">DeepSeek Harness 系统架构图</title>
  <desc id="description">基于仓库 docs/architecture.md 的逻辑架构。所有运行能力均由 Cordis 插件贡献。应用通过命名 Profile 装配插件树；Agent Loop 调用模型适配器和工具管线，并将持久事实写入 Session 日志；能力提供者连接本地或远程执行环境。箭头表示逻辑调用或数据关系，不表示部署进程。</desc>
  <defs>
    <linearGradient id="header" x2="1" y2="1"><stop stop-color="#173B78"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#64748B" stroke-width="1.5"/></marker>
    <style>
      text { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #1F2937; }
      .heading { font-size: 22px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #526174; }
      .white { fill: white; }
      .box { fill: white; stroke: #D8E1EC; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748B; stroke-width: 2; marker-end: url(#arrow); }
      .data { fill: none; stroke: #64748B; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1340" fill="#F3F5F8"/>
  <rect x="32" y="28" width="1536" height="104" rx="18" fill="url(#header)"/>
  <text x="60" y="73" font-size="32" font-weight="700" class="white">DeepSeek Harness · 系统架构</text>
  <text x="60" y="108" font-size="18" class="white">Cordis 全插件运行时 · 配置化组合 · 事件驱动扩展 · 可重建的模型上下文</text>

  <!-- 应用入口描述交互载体；Profile 决定实际挂载的插件，不代表每种载体都启动独立服务。 -->
  <rect x="32" y="152" width="1536" height="132" rx="14" fill="#EAF1FE" stroke="#C7D8F8"/>
  <text x="54" y="183" class="heading">01  应用与接入</text>
  <g text-anchor="middle">
    <rect x="54" y="201" width="270" height="62" rx="9" class="box"/><text x="189" y="227" class="label">Web 浏览器</text><text x="189" y="250" class="small">Web 应用 · RPC 与事件流</text>
    <rect x="344" y="201" width="270" height="62" rx="9" class="box"/><text x="479" y="227" class="label">Electron 桌面端</text><text x="479" y="250" class="small">Desktop Host + Web 应用</text>
    <rect x="634" y="201" width="270" height="62" rx="9" class="box"/><text x="769" y="227" class="label">Headless</text><text x="769" y="250" class="small">单次任务运行 · 无服务器</text>
    <rect x="924" y="201" width="310" height="62" rx="9" class="box"/><text x="1079" y="227" class="label">TypeScript / Python SDK</text><text x="1079" y="250" class="small">SDK JSON-RPC 服务</text>
    <rect x="1254" y="201" width="292" height="62" rx="9" class="box"/><text x="1400" y="227" class="label">ACP 客户端</text><text x="1400" y="250" class="small">自动化集成</text>
  </g>
  <path d="M800 284V308" class="flow"/>

  <rect x="32" y="310" width="1536" height="153" rx="14" fill="#EEF2FF" stroke="#D3D8F5"/>
  <text x="54" y="342" class="heading">02  启动与插件装配</text>
  <text x="54" y="372" class="body">统一 dsh Profile 启动：web / headless / sdk / sdk-minimal / acp；桌面端使用保留 desktop Profile</text>
  <rect x="54" y="388" width="1492" height="53" rx="9" class="box"/>
  <text x="76" y="421" class="body">有序 Bundles → Profile patch → Home patch → --patch overlays → Cordis 插件树</text>
  <text x="1070" y="421" class="small">sdk-minimal 独立组合，不加载 dsh-base</text>
  <path d="M800 463V488" class="flow"/>

  <!-- “核心运行”是职责分组而非特权内核；模型、工具、会话与循环本身均是可替换插件。 -->
  <rect x="32" y="490" width="1190" height="459" rx="14" fill="#FFFFFF" stroke="#BFD2ED" stroke-width="2"/>
  <text x="54" y="523" class="heading">03  Cordis Context · 核心运行与会话</text>
  <text x="54" y="550" class="small">插件贡献 Service / 类型化事件 / 可逆副作用；注册随插件卸载清理</text>
  <rect x="54" y="572" width="253" height="132" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="72" y="604" class="label">Agent 与输入协调</text>
  <text x="72" y="634" class="body">ctx.agents · inbox</text>
  <text x="72" y="661" class="small">智能体生命周期 / 排队输入</text>
  <text x="72" y="686" class="small">每个 Agent 的作用域注册</text>

  <rect x="345" y="572" width="356" height="132" rx="10" fill="#2563EB"/>
  <text x="367" y="605" class="label white">Agent Loop · ctx.agentLoop</text>
  <text x="367" y="637" class="body white">输入 → 提示词组装 → 模型请求</text>
  <text x="367" y="666" class="body white">→ 工具执行 → 后续 step / 结束</text>
  <text x="367" y="690" class="small white">一个 turn 包含零个或多个 step</text>
  <path d="M307 635H343" class="flow"/>

  <rect x="743" y="572" width="456" height="61" rx="9" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="762" y="598" class="label">System Prompt · ctx.systemPrompt</text>
  <text x="762" y="621" class="small">提示词分区 + 当前 step 可用的工具 schema</text>
  <path d="M743 603H703" class="flow"/>
  <rect x="743" y="649" width="456" height="55" rx="9" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="762" y="673" class="label">LLM · ctx.llm</text>
  <text x="762" y="694" class="small">模型适配器 / 请求绑定 / 流式输出</text>
  <path d="M701 676H741" class="flow"/>

  <rect x="54" y="748" width="647" height="75" rx="10" fill="#ECFDF5" stroke="#A7E0C6"/>
  <text x="73" y="777" class="label">Tools · ctx.tools</text>
  <text x="73" y="806" class="body">作用域工具注册 → pre-execute → execute → post-execute</text>
  <path d="M520 704V746" class="flow"/>
  <rect x="743" y="748" width="456" height="75" rx="10" fill="#F5F3FF" stroke="#D7CCF4"/>
  <text x="762" y="777" class="label">Session · ctx.sessions</text>
  <text x="762" y="806" class="body">只追加 SessionEvent · 模型可见即已记录</text>
  <path d="M653 704V724H970V746" class="data"/>

  <rect x="54" y="857" width="647" height="68" rx="10" class="box"/>
  <text x="73" y="885" class="label">事件扩展点</text>
  <text x="73" y="911" class="small">Session 持久事实 / Agent 运行事件 / 能力策略事件</text>
  <rect x="743" y="857" width="456" height="68" rx="10" fill="#F5F3FF" stroke="#D7CCF4"/>
  <text x="762" y="885" class="label">投影 / 持久化 / 历史重建</text>
  <text x="762" y="911" class="small">ctx.sessionProjections · 恢复 / 分叉 / 会话视图</text>
  <path d="M970 823V855" class="data"/>

  <!-- 侧栏为横切能力；实际启用情况取决于所选 Profile 与补丁。 -->
  <rect x="1242" y="490" width="326" height="459" rx="14" fill="#FFF9EE" stroke="#EAD5AA"/>
  <text x="1264" y="524" class="heading">治理与运维插件</text>
  <text x="1264" y="551" class="small">通过服务与事件参与运行</text>
  <rect x="1264" y="574" width="282" height="67" rx="9" class="box"/>
  <text x="1280" y="601" class="label">安全与策略</text><text x="1280" y="627" class="small">审批 / 沙箱 / 执行守卫</text>
  <rect x="1264" y="657" width="282" height="67" rx="9" class="box"/>
  <text x="1280" y="684" class="label">配置与身份</text><text x="1280" y="710" class="small">Settings / Credentials</text>
  <rect x="1264" y="740" width="282" height="67" rx="9" class="box"/>
  <text x="1280" y="767" class="label">插件管理</text><text x="1280" y="793" class="small">安装 / 启停 / 组合与兼容性</text>
  <rect x="1264" y="823" width="282" height="102" rx="9" class="box"/>
  <text x="1280" y="850" class="label">可观测性</text><text x="1280" y="876" class="small">会话遥测 / OTel Logs</text><text x="1280" y="902" class="small">日志导出不等同于完整 Tracing</text>

  <path d="M376 949V977" class="flow"/>
  <rect x="32" y="979" width="1536" height="136" rx="14" fill="#EAF8F5" stroke="#B8DED5"/>
  <text x="54" y="1011" class="heading">04  能力插件与可替换提供者</text>
  <text x="54" y="1039" class="small">完整能力由 Service Definition / Service Provider / Consumer 三种职责组成</text>
  <g text-anchor="middle">
    <rect x="54" y="1053" width="356" height="42" rx="8" class="box"/><text x="232" y="1080" class="body">文件系统 / Shell / Terminal / LSP</text>
    <rect x="430" y="1053" width="356" height="42" rx="8" class="box"/><text x="608" y="1080" class="body">MCP / Skill / Web / Browser</text>
    <rect x="806" y="1053" width="356" height="42" rx="8" class="box"/><text x="984" y="1080" class="body">Subagent / Team / Workflow / Jobs</text>
    <rect x="1182" y="1053" width="364" height="42" rx="8" class="box"/><text x="1364" y="1080" class="body">会话存储 / 模型服务适配</text>
  </g>
  <path d="M800 1115V1141" class="flow"/>
  <rect x="32" y="1143" width="1536" height="100" rx="14" fill="#E9EDF3" stroke="#CBD5E1"/>
  <text x="54" y="1176" class="heading">05  执行环境与外部系统</text>
  <text x="54" y="1208" class="body">本地文件与进程 / 远程 SSH 或沙箱环境 / 外部 MCP 服务 / 模型 API / 持久化介质与遥测接收端</text>
  <text x="54" y="1231" class="small">文件系统与子进程提供者需要协调配置；不是只切换沙箱插件即可迁移全部执行能力。</text>

  <path d="M54 1275H101" class="flow"/><text x="114" y="1281" class="small">装配 / 逻辑调用</text>
  <path d="M315 1275H362" class="data"/><text x="375" y="1281" class="small">持久事件 / 派生数据</text>
  <text x="660" y="1281" class="small">逻辑架构，非部署拓扑；能力是否加载取决于 Profile 配置。</text>
  <text x="54" y="1313" class="small">依据：docs/architecture.md · docs/subsystems/otel.md ｜ 中文系统总览</text>
</svg>
